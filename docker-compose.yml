
services:
  db:
    image: postgres:16-alpine
    container_name: limited-drop-db
    environment:
      POSTGRES_USER: drop_user
      POSTGRES_PASSWORD: drop_pass      
      POSTGRES_DB: limited_drop
    ports:
      
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drop_user -d limited_drop"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata: